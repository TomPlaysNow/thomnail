<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/><stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff5e62"/>
    </linearGradient>
    <linearGradient id="dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5266"/><stop offset="1" stop-color="#2c3140"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="pic"><rect x="332" y="250" width="360" height="270" rx="18"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Filmstreifen unten, Mittelzelle leer -->
  <g clip-path="url(#sq)">
    <rect x="100" y="610" width="824" height="200" fill="#0b0c0f"/>
    <g fill="#e8e8ec" fill-opacity=".85">
      <rect x="118" y="622" width="28" height="22" rx="5"/><rect x="178" y="622" width="28" height="22" rx="5"/>
      <rect x="238" y="622" width="28" height="22" rx="5"/><rect x="298" y="622" width="28" height="22" rx="5"/>
      <rect x="358" y="622" width="28" height="22" rx="5"/><rect x="418" y="622" width="28" height="22" rx="5"/>
      <rect x="478" y="622" width="28" height="22" rx="5"/><rect x="538" y="622" width="28" height="22" rx="5"/>
      <rect x="598" y="622" width="28" height="22" rx="5"/><rect x="658" y="622" width="28" height="22" rx="5"/>
      <rect x="718" y="622" width="28" height="22" rx="5"/><rect x="778" y="622" width="28" height="22" rx="5"/>
      <rect x="838" y="622" width="28" height="22" rx="5"/><rect x="898" y="622" width="28" height="22" rx="5"/>
      <rect x="118" y="776" width="28" height="22" rx="5"/><rect x="178" y="776" width="28" height="22" rx="5"/>
      <rect x="238" y="776" width="28" height="22" rx="5"/><rect x="298" y="776" width="28" height="22" rx="5"/>
      <rect x="358" y="776" width="28" height="22" rx="5"/><rect x="418" y="776" width="28" height="22" rx="5"/>
      <rect x="478" y="776" width="28" height="22" rx="5"/><rect x="538" y="776" width="28" height="22" rx="5"/>
      <rect x="598" y="776" width="28" height="22" rx="5"/><rect x="658" y="776" width="28" height="22" rx="5"/>
      <rect x="718" y="776" width="28" height="22" rx="5"/><rect x="778" y="776" width="28" height="22" rx="5"/>
      <rect x="838" y="776" width="28" height="22" rx="5"/><rect x="898" y="776" width="28" height="22" rx="5"/>
    </g>
    <rect x="92"  y="658" width="150" height="104" rx="10" fill="url(#dim)"/>
    <rect x="264" y="658" width="150" height="104" rx="10" fill="url(#dim)"/>
    <rect x="610" y="658" width="150" height="104" rx="10" fill="url(#dim)"/>
    <rect x="782" y="658" width="150" height="104" rx="10" fill="url(#dim)"/>
  </g>
  <!-- leerer Slot: hier kommt der Frame her -->
  <rect x="441" y="662" width="142" height="96" rx="10" fill="#ff7a55" fill-opacity=".18" stroke="#ff9a5a" stroke-width="8"/>
  <!-- herausgehobener Frame, leicht gekippt -->
  <g transform="rotate(-6 512 385)">
    <g filter="url(#sh)">
      <rect x="318" y="236" width="388" height="298" rx="30" fill="#fff"/>
    </g>
    <g clip-path="url(#pic)">
      <rect x="332" y="250" width="360" height="270" fill="url(#sky)"/>
      <circle cx="600" cy="330" r="40" fill="#fff3c4"/>
      <path d="M332 520 L430 390 L495 460 L570 370 L692 520 Z" fill="#2d2346"/>
    </g>
  </g>
