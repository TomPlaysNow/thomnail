<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/><stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff5e62"/>
    </linearGradient>
    <linearGradient id="dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5266"/><stop offset="1" stop-color="#2c3140"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9a5a" stop-opacity=".55"/><stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="pic"><rect x="347" y="200" width="330" height="290" rx="20"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Filmstreifen wie im aktuellen Icon, etwas tiefer -->
  <rect x="100" y="560" width="824" height="260" fill="#0b0c0f" clip-path="url(#sq)"/>
  <g fill="#e8e8ec" fill-opacity=".85">
    <rect x="130" y="574" width="30" height="24" rx="5"/><rect x="190" y="574" width="30" height="24" rx="5"/>
    <rect x="250" y="574" width="30" height="24" rx="5"/><rect x="744" y="574" width="30" height="24" rx="5"/>
    <rect x="804" y="574" width="30" height="24" rx="5"/><rect x="864" y="574" width="30" height="24" rx="5"/>
    <rect x="130" y="782" width="30" height="24" rx="5"/><rect x="190" y="782" width="30" height="24" rx="5"/>
    <rect x="250" y="782" width="30" height="24" rx="5"/><rect x="744" y="782" width="30" height="24" rx="5"/>
    <rect x="804" y="782" width="30" height="24" rx="5"/><rect x="864" y="782" width="30" height="24" rx="5"/>
    <rect x="370" y="574" width="30" height="24" rx="5"/><rect x="430" y="574" width="30" height="24" rx="5"/>
    <rect x="490" y="574" width="30" height="24" rx="5"/><rect x="550" y="574" width="30" height="24" rx="5"/>
    <rect x="610" y="574" width="30" height="24" rx="5"/>
    <rect x="370" y="782" width="30" height="24" rx="5"/><rect x="430" y="782" width="30" height="24" rx="5"/>
    <rect x="490" y="782" width="30" height="24" rx="5"/><rect x="550" y="782" width="30" height="24" rx="5"/>
    <rect x="610" y="782" width="30" height="24" rx="5"/>
  </g>
  <rect x="120" y="614" width="170" height="152" rx="10" fill="url(#dim)"/>
  <rect x="734" y="614" width="170" height="152" rx="10" fill="url(#dim)"/>
  <!-- leerer Slot, gestrichelt -->
  <rect x="337" y="614" width="350" height="152" rx="14" fill="none" stroke="#ff9a5a" stroke-width="8" stroke-dasharray="26 18"/>
  <!-- Bewegungsspur zwischen Slot und Frame -->
  <rect x="347" y="490" width="330" height="120" fill="url(#trail)"/>
  <!-- herausgezogener Frame, gerade -->
  <g filter="url(#sh)">
    <rect x="333" y="186" width="358" height="318" rx="30" fill="#fff"/>
  </g>
  <g clip-path="url(#pic)">
    <rect x="347" y="200" width="330" height="290" fill="url(#sky)"/>
    <circle cx="590" cy="285" r="42" fill="#fff3c4"/>
    <path d="M347 490 L445 345 L510 420 L585 325 L677 490 Z" fill="#2d2346"/>
  </g>
</svg>
